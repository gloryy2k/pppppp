services:
  # Apache mod_php — vulnerable PHP 8.2.0, default config
  apache:
    build:
      context: .
      dockerfile: Dockerfile.apache
    ports:
      - "18080:80"
    volumes:
      - ./www:/var/www/html
      - ./php-apache.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro

  # Nginx + PHP-FPM — same PHP 8.2.0, realistic FPM deployment
  nginx:
    image: nginx:1.24-alpine
    ports:
      - "18081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/html:ro
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    volumes:
      - ./www:/var/www/html

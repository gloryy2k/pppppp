server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_P2S_REQUEST_ID $http_x_p2s_request_id;
        fastcgi_param HTTP_X_P2S_NONCE $http_x_p2s_nonce;
        fastcgi_pass fpm-affected:9000;
    }
}
